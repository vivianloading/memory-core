name: Synthetic First Wake — one time

on:
  push:
    branches:
      - run/first-wake-once-20261103

permissions:
  contents: read

concurrency:
  group: synthetic-first-wake-once-20261103
  cancel-in-progress: false

jobs:
  first-wake:
    if: ${{ github.run_attempt == 1 && github.ref == 'refs/heads/run/first-wake-once-20261103' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact reviewed First Wake harness
        uses: actions/checkout@v4
        with:
          ref: 21307dee2419af06828df4c08bb01813ad85a35b
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require transport secret
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -eu
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY repository secret is not configured."
            exit 1
          fi

      - name: Execute exactly one synthetic First Wake
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FIRST_WAKE_MODEL_ID: gpt-5.6-sol
        run: |
          set -eu
          python tests/first_wake_lab.py \
            --execute \
            --model-id "${FIRST_WAKE_MODEL_ID}" \
            --api-key-env OPENAI_API_KEY \
            --output first_wake_lab_evidence.json

      - name: Preserve First Wake evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-first-wake-evidence-${{ github.run_id }}
          path: first_wake_lab_evidence.json
          if-no-files-found: ignore
          retention-days: 7
